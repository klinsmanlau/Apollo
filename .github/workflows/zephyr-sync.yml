# Hourly Zephyr Scale -> Apollo mirror (migration-period job).
#
# While the team still authors in Zephyr (until year-end), this keeps Apollo's
# test cases + cycles up to date. Both sync scripts are idempotent, so re-runs
# update rather than duplicate.
#
# Required repo config (Settings -> Secrets and variables -> Actions):
#   Secrets:
#     DATABASE_URL      Supabase TRANSACTION pooler URL, e.g.
#                       postgresql://...pooler.supabase.com:6543/postgres?pgbouncer=true
#     DIRECT_URL        Supabase direct URL (:5432/postgres)
#     ZEPHYR_API_TOKEN  Zephyr Scale Cloud API token
#   Variables:
#     APOLLO_PROJECT_ID   e.g. rytbank-qa-team
#     ZEPHYR_PROJECT_KEY  e.g. TS
#
# Note: scheduled workflows run only from the default branch (main), and cron
# times are UTC and may be delayed a few minutes under GitHub load.

name: Zephyr -> Apollo sync

on:
  schedule:
    - cron: "0 * * * *" # top of every hour (UTC)
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Never let two syncs overlap (a run may take longer than an hour on a big project).
concurrency:
  group: zephyr-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      ZEPHYR_API_TOKEN: ${{ secrets.ZEPHYR_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Cases first — cycle executions attach to existing cases.
      - name: Sync test cases
        run: npm run zephyr:sync -- "${{ vars.APOLLO_PROJECT_ID }}" "${{ vars.ZEPHYR_PROJECT_KEY }}"

      - name: Sync test cycles
        run: npm run zephyr:sync-cycles -- "${{ vars.APOLLO_PROJECT_ID }}" "${{ vars.ZEPHYR_PROJECT_KEY }}"

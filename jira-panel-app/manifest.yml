modules:
  jira:issuePanel:
    - key: apollo-test-results-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Apollo Test Results
      icon: https://raw.githubusercontent.com/atlassian/forge-toolbelt/main/assets/logo.svg
  function:
    - key: resolver
      handler: resolvers/index.handler

resources:
  - key: main
    path: src/frontend/index.jsx

permissions:
  scopes:
    - read:jira-work
  external:
    fetch:
      backend:
        # Forge's egress allowlist requires a real HTTPS domain — plain
        # "localhost" is rejected. While using `forge tunnel` against local
        # dev, expose Apollo through a tunnel (e.g. `ngrok http 3000`) and put
        # that hostname here (no scheme, no path), matching APOLLO_BASE_URL
        # set via `forge variables set`. Swap for your real domain once
        # Apollo is deployed publicly.
        - "*.ngrok-free.app"

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/02e74bb7-4e07-4ca0-b737-70b960b7559d
